map "$ssl_early_data:$request_method" $reject_early_data {
    default 0;
    ~^1:(GET|HEAD|OPTIONS)$ 0;
    ~^1: 1;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name ionailabs.cn;
    return 301 https://ionailabs.cn$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.ionailabs.cn;
    return 301 https://ionailabs.cn$request_uri;
}

# 保留原 HTTP 端口，统一跳转到标准 HTTPS 地址。
server {
    listen 8601 default_server;
    listen [::]:8601 default_server;
    server_name _;
    return 444;
}

server {
    listen 8601;
    listen [::]:8601;
    server_name ionailabs.cn www.ionailabs.cn;
    return 301 https://ionailabs.cn$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/ionailabs.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ionailabs.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 444;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ionailabs.cn;

    ssl_certificate /etc/letsencrypt/live/ionailabs.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ionailabs.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://ionailabs.cn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ionailabs.cn;

    root /var/www/11ailabs/dist;
    client_max_body_size 20m;

    ssl_certificate /etc/letsencrypt/live/ionailabs.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ionailabs.cn/privkey.pem;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Nginx 不允许在同一 server 中重复覆盖 Certbot 的票据开关，因此主站固定
    # 同一套受管策略并仅把票据改为 on；发布前由 check-nginx-tls-policy.sh 防漂移。
    ssl_session_cache shared:le_nginx_SSL:10m;
    ssl_session_timeout 1440m;
    ssl_session_tickets on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_early_data on;

    # TLS 1.3 早期数据只允许幂等读取，避免写请求被重放。
    if ($reject_early_data) {
        return 425;
    }

    # 手机端首屏依赖必须压缩传输；默认 Nginx 只压缩 HTML。
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Early-Data $ssl_early_data;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Early-Data $ssl_early_data;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # Vite 文件名包含内容哈希，可安全长期缓存。
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # HTML 不长期缓存，避免部署后混用新旧资源而白屏。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
